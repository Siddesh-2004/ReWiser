services:
  mongo:
    image: mongo:7
    container_name: voice-revision-mongo
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"   # localhost only; your phone talks to the Node API, not Mongo
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo-data: